<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div>
        <h1 id="heading">IMAGE SLIDER</h1>
    </div>
    <div class="slider">
        <div class="image-cont">
            <img src="https://picsum.photos/id/20/700/400" alt="">
            <img src="https://picsum.photos/id/45/700/400" alt="">
            <img src="https://picsum.photos/id/50/700/400" alt="">
            <img src="https://picsum.photos/id/100/700/400" alt="">
            <img src="https://picsum.photos/id/210/700/400" alt="">
        </div>
        <i class="fa-solid fa-angles-left btn pre"></i>
        <i class="fa-solid fa-angles-right btn next"></i>
    </div>




    <script src="action.js"></script>
</body>
</html>
